<mat-card appearance="outlined">
     <mat-card-header>
        <mat-card-title>
            Total items :{{totalItems}} | Selcted Items: {{totalSelected }} | Started Items : {{ totalStared}}
        </mat-card-title>
    </mat-card-header>
<div class="whitespace">
    <mat-divider/>
</div>
 <mat-card-content>
    <section class="card">
        <app-add-item-form (addItem)="onAddItem($event  )"> </app-add-item-form>
    </section>

<ol class="list-container">
    @for(item of listItems; track item){
    <li>
     <app-item-card 
        [data]="item"
        (select)="toggleSelected(item)"
        (disable)="toggleStatus(item)"
        (markStar)="toggleMakeStar(item.id)"
        (remove)="removeItem(item.id)"
     />
    </li>
    }
</ol>
</mat-card-content>
</mat-card>
 <button (click)="viewState()"> View State </button>
